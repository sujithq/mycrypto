name: Propose daily crypto gems

on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-gems-issue
  cancel-in-progress: false

env:
  NPM_CONFIG_LOGLEVEL: verbose

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Validate repository
        run: npm run check
      - name: Generate adoption package
        run: >-
          npm run daily-gems-issue --
          --output "${RUNNER_TEMP}/daily-gems-issue.md"
          --summary-output "${RUNNER_TEMP}/daily-gems-summary.json"
      - name: Create or update daily issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          npm run publish-daily-gems-issue --
          --body "${RUNNER_TEMP}/daily-gems-issue.md"
          --summary "${RUNNER_TEMP}/daily-gems-summary.json"