name: Manage portfolio defaults

on:
  workflow_dispatch:
    inputs:
      portfolio_json:
        description: JSON generated by manage.html
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: repository-data-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment: portfolio-management
    env:
      PORTFOLIO_UPDATE_JSON: ${{ inputs.portfolio_json }}
      MANAGEMENT_SECRET_CONFIGURED: ${{ secrets.PORTFOLIO_MANAGEMENT_SECRET != '' }}
    steps:
      - name: Verify management secret is configured
        run: |
          if [ "$MANAGEMENT_SECRET_CONFIGURED" != "true" ]; then
            echo "PORTFOLIO_MANAGEMENT_SECRET must be configured in GitHub before managing defaults."
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Apply managed portfolio defaults
        run: node scripts/manage-portfolio.mjs
      - name: Validate
        run: npm run check
      - name: Commit managed defaults
        run: |
          if git diff --quiet -- data/portfolio.json data/weekly-report.json; then
            echo "No portfolio changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/portfolio.json data/weekly-report.json
          git commit -m "data: update managed portfolio defaults"
          git push
